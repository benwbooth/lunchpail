[package]
name = "lunchpail-speech"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "lunchpail-speech"
path = "src/main.rs"

[features]
default = []
vulkan = ["whisper-rs/vulkan"]
metal = ["whisper-rs/metal"]

[dependencies]
anyhow.workspace = true
serde_json.workspace = true
lunchpail-ai = { path = "../lunchpail-ai" }
whisper-rs = { version = "=0.16.0", default-features = false, features = ["raw-api"] }
